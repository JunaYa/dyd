[package]
name = "dyd"
version = "0.1.6"
description = "DYD excalidraw tool"
authors = ["ayac3j@gmail.com"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dyd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["config-json5"] }

[dependencies]
tauri = { version = "2.11.6", features = [
  "macos-private-api",
  "protocol-asset",
  "config-json5",
  "tray-icon",
] }
tauri-plugin-shell = "2.3.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
anyhow = "1.0.104"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-clipboard-manager = "2.3.3"
scrap = "0.5.0"
strum_macros = "0.28.0"
strum = "0.28.0"
image = "0.25.10"
tauri-plugin-store = "2.4.5"
xcap = "0.9.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
tauri-plugin-os = "2.3.2"
core-foundation = "0.10.1"
libc = "0.2.189"
base64 = "0.23.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-positioner = { version = "2.3.4", features = ["tray-icon"] }

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.27.0"
